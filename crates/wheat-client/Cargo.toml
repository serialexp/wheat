chrono = { workspace = true }
crc32fast = "1"
globset = "0.4"
libc = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
wheat-core = { path = "../wheat-core" }
wheat-ignore = { path = "../wheat-ignore" }
wheat-git = { path = "../wheat-git" }
wheat-protocol = { path = "../wheat-protocol" }
wheat-remote = { path = "../wheat-remote" }
