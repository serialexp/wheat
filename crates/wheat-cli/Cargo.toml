[package]
name = "wheat-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "wheat"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_yaml = { workspace = true }
wheat-core = { path = "../wheat-core" }
wheat-store = { path = "../wheat-store" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
