[package]
name = "wheat-cli"
version.workspace = true
edition = "2024"
autotests = false

[[bin]]
name = "wheat"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
mimalloc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tracing = { workspace = true }
uuid = { workspace = true }
wheat-client = { path = "../wheat-client" }
wheat-core = { path = "../wheat-core" }
wheat-ignore = { path = "../wheat-ignore" }
wheat-git = { path = "../wheat-git" }
wheat-remote = { path = "../wheat-remote" }
wheat-store = { path = "../wheat-store" }
wheat-trace = { path = "../wheat-trace" }

[dev-dependencies]
blake3 = { workspace = true }
libc = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { workspace = true }
wheat-protocol = { path = "../wheat-protocol" }
wheat-server = { path = "../wheat-server" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/harnesses/integration.rs"
