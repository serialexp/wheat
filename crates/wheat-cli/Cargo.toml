[package]
name = "wheat-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "wheat"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
futures = "0.3"
libc = { workspace = true }
mimalloc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.28", features = ["connect"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
wheat-core = { path = "../wheat-core" }
wheat-ignore = { path = "../wheat-ignore" }
wheat-git = { path = "../wheat-git" }
wheat-protocol = { path = "../wheat-protocol" }
wheat-store = { path = "../wheat-store" }
wheat-trace = { path = "../wheat-trace" }

[dev-dependencies]
wheat-server = { path = "../wheat-server" }

[lints]
workspace = true
