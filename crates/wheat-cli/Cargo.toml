[package]
name = "wheat-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "wheat"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
libc = { workspace = true }
tokio = { workspace = true }
wheat-core = { path = "../wheat-core" }
wheat-store = { path = "../wheat-store" }

[dev-dependencies]
tempfile = "3"
wheat-git = { path = "../wheat-git" }

[lints]
workspace = true
