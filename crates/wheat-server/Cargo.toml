[package]
name = "wheat-server"
version.workspace = true
edition = "2024"
autotests = false

[[bin]]
name = "wheat-server"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
blake3 = { workspace = true }
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
mimalloc = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = "0.28"
toml = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
wheat-core = { path = "../wheat-core" }
wheat-protocol = { path = "../wheat-protocol" }
wheat-store = { path = "../wheat-store" }
wheat-trace = { path = "../wheat-trace" }

[dev-dependencies]
futures = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", features = ["connect"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/harnesses/integration.rs"
