[package]
name = "wheat-core"
version.workspace = true
edition = "2024"
autotests = false

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
wheat-binschema = { package = "wheat-binschema-generated", path = "generated" }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = "1"
serde_json = { workspace = true }
serde_yaml = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/harnesses/integration.rs"
