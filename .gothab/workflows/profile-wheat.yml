name: Wheat Gothab Workflow Performance Profile

on:
  workflow_dispatch:

jobs:
  profile:
    name: Wheat Gothab workflow
    # Keep profile comparisons on the pinned c8id.xlarge performance pool.
    runs-on: pt-heavy
    # A cold release build plus the 20-minute profile contract needs headroom for
    # checkout, toolchain installation, and report upload on a fresh runner.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      # The runner checkout is a mounted workspace whose filesystem rejects
      # directory fsync; profile the durable store on the runner's local disk.
      WHEAT_PROFILE_SCRATCH_ROOT: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Wheat profile binaries
        run: cargo build --release -p wheat-cli --bin wheat --example wheat_gothab_profile

      - name: Run Wheat Gothab workflow profile
        run: target/release/examples/wheat_gothab_profile "$GITHUB_WORKSPACE" profile.json

      - uses: actions/profile@v1
        with:
          path: profile.json
          name: wheat-gothab-workflow
