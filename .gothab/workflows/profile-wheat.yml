name: Wheat Gothab Workflow Performance Profile

# Runs Wheat's end-to-end workflow against the Gothab repository as a corpus.
# Needs a Gothab-hosted runner: `pt-heavy` and `actions/profile` are Gothab's.

on:
  workflow_dispatch:

jobs:
  profile:
    name: Wheat Gothab workflow
    # Keep profile comparisons on the pinned c8id.xlarge performance pool.
    runs-on: pt-heavy
    # The measured Gothab corpus takes about 55 minutes on the pinned runner;
    # leave explicit headroom for a cold release build, setup, and artifact upload.
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      # The runner checkout is a mounted workspace whose filesystem rejects
      # directory fsync; profile the durable store on the runner's local disk.
      WHEAT_BENCH_SCRATCH_ROOT: /tmp
    steps:
      - uses: actions/checkout@v5

      # The corpus: full history, since the profile imports every reachable commit.
      - uses: actions/checkout@v5
        with:
          repository: serialexp/gothab
          path: corpus
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Wheat profile binaries
        run: cargo build --release -p wheat-cli -p wheat-bench --bin wheat --bin wheat-bench

      - name: Run Wheat Gothab workflow profile
        run: target/release/wheat-bench corpus "$GITHUB_WORKSPACE/corpus" --output profile.json --no-save

      - uses: actions/profile@v1
        with:
          path: profile.json
          name: wheat-gothab-workflow
