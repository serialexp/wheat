name: CI

# Lint, test and type-check every push to main, on gothab's Linux runners. The same
# jobs as `.github/workflows/ci.yml`, which runs only on the GitHub mirror: gothab
# runs `.gothab/workflows` and ignores `.github/workflows` while this directory has
# workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Gothab's runners have no rustup: this installs it, with the toolchain
      # rust-toolchain.toml pins.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # wheat-server as a library, without the binary's dependencies, as Gothab
      # embeds it. The workspace build above always has the default features on.
      - run: cargo clippy -p wheat-server --lib --no-default-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: taiki-e/install-action@nextest
      # The suite needs git. The S3 tests skip themselves without WHEAT_TEST_S3_*.
      - run: cargo nextest run --workspace --all-targets --locked --profile ci
      - run: cargo test --workspace --doc --locked

  # Everything must build for Windows, though workspace file operations refuse to run
  # there (`just check-windows`).
  check-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-gnu
      - run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-gnu
        env:
          RUSTFLAGS: -D warnings
